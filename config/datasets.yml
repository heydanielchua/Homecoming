# Pinned data.gov.sg resource ids. A failed sync alerts rather than silently
# switching ids (Risk: "dataset IDs and endpoints change").
# last_checked is the date a human last confirmed the id resolves.
last_checked: 2026-10-11

api:
  # CKAN-style datastore endpoint. Keyless use is rate limited; set
  # DATAGOV_API_KEY in the environment to raise the limit.
  datastore_url: https://data.gov.sg/api/action/datastore_search
  page_size: 10000
  max_retries: 5
  timeout_seconds: 60

resale:
  # Oldest first; later files win on duplicate rows.
  - id: d_43f493c6c50d54243cc1eab0df142d6a
    label: resale 2000 - Feb 2012
  - id: d_2d5ff9ea31397b66239f245f57751537
    label: resale Mar 2012 - 2014
  - id: TODO
    label: resale 2015 - 2016
    # The PRD links this dataset but not its resource id. Paste the id from
    # data.gov.sg here; while it reads TODO the sync skips it and says so.
    confirmed: false
  - id: d_8b84c4ee58e3cfc0ece0d773c8ca6abc
    label: resale Jan 2017 onwards

property_info:
  id: d_17f5382f26140b1fdae0ba2ef6239d2f
  label: HDB property information (per block)

price_index:
  id: d_14f63e595975691e7c24a27ae4c07c79
  label: HDB resale price index (1Q2009 = 100)

town_medians:
  id: TODO
  label: Median resale prices by town and flat type (quarterly, from 2007)
  # The PRD links the dataset page but not its resource id. Until it is filled
  # in, g_town falls back to town medians computed from the resale
  # transactions themselves, which cover the same ground from 2000.
  confirmed: false

# URA Master Plan land use. Not a datastore resource: the CKAN endpoint above
# returns nothing for a geospatial dataset. It is a GeoJSON file, fetched from
# a separate host (api-open.data.gov.sg), and it is not monthly data — the
# Master Plan is approved once and amended occasionally, so `nhf sync` leaves
# it alone and `nhf sync --step land_use` fetches it when a revision lands.
land_use:
  id: d_a8c3546b26712e35021f3a681d0353ae
  label: URA Master Plan 2025 land use (GeoJSON, 190 MB)
  download_host: https://api-open.data.gov.sg/v1/public/api/datasets/{id}/poll-download
  # Was the 2019 plan (d_90d86daa5bfaa371668b84fa5f01424f) until the 2025 one
  # was found published in full. The swap is safe rather than lucky: both
  # layers carry the same property keys and the same 33 values of LU_DESC, so
  # every use still lands in a group rather than falling through to "civic".
  # 113,394 parcels against 2019's 113,212.
  approved: 2025-12-30
  confirmed: true

# HDB building outlines. One polygon per existing public housing building,
# keyed by postal code, which is what joins it to `block`. No height in it —
# the storey count comes from HDB Property Information, already loaded above —
# so the two together are what a building's shape and height are made of.
# Fetched by name, like the Master Plan: it changes when blocks are built.
outlines:
  id: d_16b157c52ed637edd6ba1232e026258d
  label: HDB Existing Building outlines (GeoJSON, 55 MB)
  download_host: https://api-open.data.gov.sg/v1/public/api/datasets/{id}/poll-download
  confirmed: true

# Amenity layers, all GeoJSON and all small, fetched the same way as the land
# use layer. `Parks` (d_0542d48f0991541706b58059381a6eca) is deliberately not
# here: it is the same 462 places as the reserves layer, published as points
# instead of boundaries, and the boundaries are the more useful of the two.
amenities:
  - key: hawker_centre
    id: d_4a086da0a5553be1d89383cd90d07ecd
    label: NEA hawker centres
  - key: park
    id: d_77d7ec97be83d44f61b85454f844382f
    label: NParks parks and nature reserves
  - key: park_facility
    id: d_14d807e20158338fd578c2913953516e
    label: NParks park facilities
  # An exit, not a station centroid: you walk to an exit, and the two differ
  # by a couple of hundred metres at a long station like Bugis or Bayfront.
  - key: mrt_exit
    id: d_b39d3a0871985372d7e1637193335da5
    label: LTA MRT station exits
  - key: bus_stop
    id: d_3f172c6feb3f4f92a2f47d93eed2908a
    label: LTA bus stops
  # ECDA's layer is KML converted to GeoJSON: every attribute arrives inside
  # one HTML table in a `Description` string rather than as its own field.
  - key: preschool
    id: d_61eefab99958fd70e6aab17320a71f1c
    label: ECDA pre-school locations

# Rainfall. One dataset per year of five-minute readings — 7,044,646 rows for
# 2021 — paged through the ordinary datastore and folded down to one row per
# station. One year is enough: every station is sampled alike, so the relative
# wet-west / dry-east picture holds, and that is as fine as the data honestly
# goes. There is no server-side aggregation to lean on; data.gov.sg has no
# datastore_search_sql endpoint.
rainfall:
  default_year: 2024
  years:
    2016: d_79a6f0fb898996d415b207bb26ed0fa6
    2017: d_1990a5a1aeaf3dd243cf4dae294a61c4
    2018: d_024fb501ce7092b71bb713eaf54fa7eb
    2019: d_61995f092320e7155b7528050880b502
    2020: d_9e7de44094f876f6804b8b5bcee45c81
    2021: d_3b41598f74f1f11fc3430348fea51af5
    2022: d_42d64cc6c176ace1c52fbb40b9ede302
    2023: d_f864cc30d58b467db83659ad17c737bf
    2024: d_a0b69d3e02576a1fd0ab673e71f83507

rentals:
  id: d_c9f57187485a850908655db0e8cfe651
  label: HDB renting out of flats, Jan 2021 onwards

# MOE's directory is the one amenity layer that is not geospatial: it comes
# down the ordinary datastore and carries a postal code but no coordinates,
# so the blocks' own geocoder is pointed at it after loading.
schools:
  id: d_688b934f82c1059ed0a6993d2a829089
  label: MOE school directory

onemap:
  search_url: https://www.onemap.gov.sg/api/common/elastic/search
  route_url: https://www.onemap.gov.sg/api/public/routingsvc/route
  token_url: https://www.onemap.gov.sg/api/auth/post/getToken
  # OneMap tokens last 3 days. Set ONEMAP_EMAIL + ONEMAP_PASSWORD to have the
  # sync job mint one, or ONEMAP_TOKEN to supply it directly.
  tile_url: https://www.onemap.gov.sg/maps/tiles/Default/{z}/{x}/{y}.png
  attribution: '<img src="https://www.onemap.gov.sg/web-assets/images/logo/om_logo.png" style="height:20px;width:20px;"/> New OneMap | Map data &copy; contributors, <a href="https://www.sla.gov.sg/">Singapore Land Authority</a>'
