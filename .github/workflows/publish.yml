# Monthly data refresh, published to the public repository that serves Pages.
#
# This repository is private — it holds docs/PRD.md and config/criteria.yml.
# Only `dist/` goes to the public one, and everything in `dist/` is derived
# from public government data on data.gov.sg.
#
# This job is for the DATA, which changes once a month. A design change does
# not need it and should not wait for it: run `./scripts/publish.sh` locally
# and the new page is live in about a minute.
#
# One manual step before this can run, because a workflow cannot grant itself
# access to another repository:
#
#   1. Create a fine-grained personal access token with
#      "Contents: read and write" on the public repository only.
#   2. Add it to THIS repository as the secret PUBLIC_SITE_TOKEN.
#   3. Set the variable PUBLIC_SITE_REPO to "<owner>/<public-repo>".
#
# Until those exist the job stops at the first step with a clear message
# rather than half-publishing.

name: Publish the site

on:
  schedule:
    # 04:15 Singapore time on the 1st, which is 20:15 UTC on the last day of
    # the previous month. GitHub runs schedules in UTC only.
    - cron: "15 20 28-31 * *"
  workflow_dispatch:
    inputs:
      skip_sync:
        description: "Reuse the cached database instead of downloading"
        type: boolean
        default: false
      refresh_slow:
        description: "Also re-download land use (174 MB) and a year of rainfall"
        type: boolean
        default: false

permissions:
  contents: read

# A half-finished publish is worse than a late one, so a running job finishes
# rather than being cancelled by the next.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Measured on the real data: about 22 minutes to page 663k transactions
    # out of the datastore, 2 to fit the curves, 45 to write 9,222 block
    # reports, and — on a first run only — around two hours to geocode 11,000
    # block addresses through OneMap. Later runs keep the geocodes.
    timeout-minutes: 300

    steps:
      - name: Check the publishing secrets exist
        env:
          TOKEN: ${{ secrets.PUBLIC_SITE_TOKEN }}
          REPO: ${{ vars.PUBLIC_SITE_REPO }}
        run: |
          missing=0
          [ -n "$TOKEN" ] || { echo "::error::secret PUBLIC_SITE_TOKEN is not set"; missing=1; }
          [ -n "$REPO" ]  || { echo "::error::variable PUBLIC_SITE_REPO is not set"; missing=1; }
          if [ "$missing" = 1 ]; then
            echo "See the comment at the top of .github/workflows/publish.yml."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: |
          pip install -e ".[dev]"
          npm ci --prefix web

      # The database is what makes a later run quick: it carries the geocodes,
      # which cost two hours to find and never change. Restoring it is the
      # difference between a 70-minute job and a four-hour one.
      - name: Restore the database
        id: db
        uses: actions/cache@v4
        with:
          path: data/nhf.db
          key: nhf-db-${{ github.run_id }}
          restore-keys: nhf-db-

      - name: Prepare the store
        run: python -m nhf.cli init

      - name: Sync
        if: ${{ !inputs.skip_sync }}
        env:
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
        run: python -m nhf.cli sync

      # Deliberately not monthly, and `nhf sync` leaves both out unless named:
      # the land use plan is 174 MB of a document revised every few years, and
      # rainfall is 704 pages of five-minute readings behind a figure that
      # moves once a year. The cached database keeps what the last run found,
      # so re-downloading them every month would cost an hour to learn nothing.
      - name: Refresh the slow layers
        if: ${{ inputs.refresh_slow }}
        env:
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
        run: |
          python -m nhf.cli sync --step land_use
          python -m nhf.cli sync --step rainfall

      - name: Build
        run: python -m nhf.cli build --curves-only

      - name: Render the site
        run: ./scripts/build_site.sh dist

      - name: Publish
        env:
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: github-actions@github.com
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: github-actions@github.com
        run: |
          ./scripts/publish.sh --no-build \
            --remote "https://x-access-token:${{ secrets.PUBLIC_SITE_TOKEN }}@github.com/${{ vars.PUBLIC_SITE_REPO }}.git"

      - name: Say what was published
        run: |
          python - <<'PY'
          import json
          m = json.load(open("dist/data/manifest.json"))
          print(f"sales to {m['as_of']['month']}")
          print(f"{m['counts']['reports']:,} block reports")
          print(f"{m['counts']['aliases']:,} street spellings indexed")
          for d in m["datasets"]:
              if d["status"] != "ok":
                  print(f"::warning::{d['dataset']}: {d['status']} — {d['message']}")
          PY
